<style>:root{color-scheme:light dark;--bg:#f6f4f5;--fg:#1d1a1c;--muted:#6e6569;--line:#e4dee1;--accent:#da0442;--panel:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141113;--fg:#f1ecee;--muted:#a69ca1;--line:#342e31;--accent:#ff4f7b;--panel:#1f1b1d}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Hiragino Sans",system-ui,sans-serif}
main{max-width:420px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
h1{font-size:20px;margin:0 0 16px}
form{display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
label{font-size:13px;color:var(--muted)}
input[type=password]{font:18px ui-monospace,monospace;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.r{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg)}
button{font:700 16px "Hiragino Sans",system-ui,sans-serif;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff}
button:disabled{opacity:.6}
#m{min-height:1.5em;margin:0;font-size:14px;color:var(--accent)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}</style>
</head>
<body>
<main>
<h1>合言葉を入力してください</h1>
<form id="f" autocomplete="on">
  <input type="text" name="username" value="timer" autocomplete="username" hidden>
  <label for="p">合言葉</label>
  <input type="password" id="p" name="password" autocomplete="current-password" required autocapitalize="off" autocorrect="off" spellcheck="false">
  <label class="r"><input type="checkbox" id="r" checked> この端末で覚える</label>
  <button id="go" type="submit">開く</button>
  <p id="m" role="status"></p>
</form>
</main>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function u64(a){var s="";a=new Uint8Array(a);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
async function open(key){
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(B.i)},key,b64(B.c));
  var html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function fromPass(p){
  var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(B.s),iterations:IT,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
}
var f=document.getElementById("f"),m=document.getElementById("m"),btn=document.getElementById("go");
try{var saved=localStorage.getItem(K);if(saved){crypto.subtle.importKey("raw",b64(saved),"AES-GCM",true,["decrypt"]).then(open).catch(function(){try{localStorage.removeItem(K)}catch(e){}})}}catch(e){}
f.addEventListener("submit",async function(e){
  e.preventDefault();m.textContent="確認しています…";btn.disabled=true;
  try{
    var key=await fromPass(document.getElementById("p").value.trim());
    if(document.getElementById("r").checked){try{localStorage.setItem(K,u64(await crypto.subtle.exportKey("raw",key)))}catch(e){}}
    await open(key);
  }catch(err){m.textContent="合言葉が違います。もう一度入力してください。";btn.disabled=false}
});
